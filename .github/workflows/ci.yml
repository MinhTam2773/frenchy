name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run content:check
      - run: npm test
      # G-72: canary secrets (not real ones), so check:dist proves no build copies them into dist/.
      - run: printf 'BETTER_AUTH_SECRET=ci-canary-better-auth-secret-0123456789\nANTHROPIC_API_KEY=ci-canary-anthropic-key-0123456789\n' > .dev.vars
      - run: npm run build
      - run: npm run check:dist
